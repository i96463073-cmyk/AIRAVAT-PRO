name: Sentinel Android APK Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # --- THE SELF-HEALING PROTOCOL ---
      - name: Check and Repair Gradle Wrapper
        run: |
          echo "Initiating wrapper diagnostic..."
          if [ ! -f gradlew ]; then
            echo "WARNING: Gradle wrapper missing. Initiating auto-generation."
            gradle wrapper
            chmod +x gradlew
            echo "Wrapper successfully generated and permissions set."
          else
            echo "Wrapper found. Verifying permissions."
            chmod +x gradlew
          fi

      - name: Compile APK
        run: ./gradlew assembleRelease

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airavat-payload
          path: app/build/outputs/apk/release/*.apk
