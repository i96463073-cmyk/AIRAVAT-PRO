name: Sentinel Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-check:
    name: Android Project Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android project structure
        run: |
          echo "Checking Android project..."
          test -f settings.gradle || test -f settings.gradle.kts
          test -d app
          echo "Android project structure found."

      - name: Check Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper missing."
            exit 1
          fi

          chmod +x gradlew
          echo "Gradle wrapper found."

      - name: Check source files
        run: |
          find app/src/main -type f
          echo "Source inspection completed."
